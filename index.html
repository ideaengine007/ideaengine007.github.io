`With powerful AI models being released, local LLM inference is seeing significant adoption in developer workflows. One of the various providers is Docker, whose Model Runner integrates inference engines like llama.cpp into Docker Desktop – reachable from every container on the system once enabled.

The talk centers on CVE-2026-28400 / ZDI-26-150, a vulnerability we discovered in DMR. A container running with default capabilities can reach unauthenticated DMR APIs and inject arbitrary arguments into the inference process, yielding a host filesystem write primitive – completely bypassing the Docker Desktop VM. On macOS, this primitive allows overwriting the Docker VM disk – destroying every container, image, and build on the host with no-user interaction. On Windows, we combine insufficient path restrictions with a UNC-path NTLM relay & error logs to leak the current username and achieve arbitrary writes anywhere that user can write.

We close by examining the layered defenses that failed – macOS Seatbelt profiles built on a denylist base, Windows Job Objects with no filesystem path restriction – and the architectural assumptions behind each. Attendees leave with a concrete model for auditing local-AI stacks before they become the next intrusion vector.` },

<script>
/* ── renderer ── */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const sev = v => v >= 9 ? "crit" : v >= 7 ? "high" : v >= 4 ? "med" : "low";

document.title = `${DATA.name} — ${DATA.role}`;
$("name").textContent = DATA.name;
$("role").textContent = DATA.role;
$("badges").textContent = DATA.badges.join(" / ");
$("portrait").src = DATA.photo;
$("portrait").alt = DATA.name;
$("links").innerHTML = DATA.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("about-text").innerHTML = DATA.about.map(p => `<p>${esc(p)}</p>`).join("");
$("blogs-body").innerHTML = DATA.blogs.map(b =>
  `<tr><td class="date">${b.date}</td><td class="title"><a href="${b.url}" target="_blank" rel="noopener">${esc(b.title)}</a></td></tr>`).join("");
$("talks-body").innerHTML = DATA.talks.filter(t => !t.upcoming).map(t =>
  `<tr><td class="year">${t.year}</td><td class="conf">${esc(t.conf)}</td><td class="title"><a href="${t.url}" target="_blank" rel="noopener">${esc(t.title)}</a></td></tr>` +
  (t.desc ? `<tr><td colspan="3"><details class="talk-abstract"><summary>Abstract</summary><div class="abs">${esc(t.desc)}</div></details></td></tr>` : "")).join("");
const up = DATA.talks.find(t => t.upcoming);
if (up) {
  $("up-talk-link").textContent = up.title;
  $("up-talk-link").href = up.url;
  $("up-conf").textContent = up.conf;
  $("up-date").textContent = up.date || up.year;
  $("up-abs").textContent = up.desc;
}
$("zdi-note").textContent = DATA.zdiNote;
$("zdi-body").innerHTML = DATA.zdi.map(z =>
  `<tr><td><a href="https://www.zerodayinitiative.com/advisories/${z.id}" target="_blank" rel="noopener">${z.id}</a></td>` +
  `<td><span class="chip ${sev(z.cvss)}">${z.cvss.toFixed(1)}</span></td>` +
  `<td class="title">${z.zero ? `<span class="tag0day">0-Day</span>` : ""}${esc(z.name)}</td></tr>`).join("");
$("misc-list").innerHTML = DATA.misc.map(m =>
  `<li><span class="date">${m.date}</span><a href="${m.url}" target="_blank" rel="noopener">${esc(m.title)}</a></li>`).join("");
$("quote").innerHTML =
  `“${esc(DATA.quote.text)}”<cite><a href="${DATA.quote.url}" target="_blank" rel="noopener">${esc(DATA.quote.cite)}</a></cite>`;
$("credit").innerHTML = `This page is heavily inspired by <a href="${DATA.inspiredBy.url}" target="_blank" rel="noopener">${esc(DATA.inspiredBy.label)}</a>`;

const themeBtn = $("theme-toggle");
function syncThemeBtn(){
  const t = document.documentElement.dataset.theme || "light";
  themeBtn.textContent = t === "dark" ? "Light" : "Dark";
}
syncThemeBtn();
themeBtn.addEventListener("click", () => {
  const next = (document.documentElement.dataset.theme === "dark") ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("ns-theme", next);
  syncThemeBtn();
});
</script>
